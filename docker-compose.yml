version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ccs_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - POSTGRES_URI=postgresql://postgres:postgres@postgres:5432/climate_db
      - WATSON_API_KEY=${WATSON_API_KEY}
      - WATSON_URL=${WATSON_URL}
      - WATSON_ASSISTANT_ID=${WATSON_ASSISTANT_ID}
    depends_on:
      mongo:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - ccs_net

  simulator:
    build: ./simulator
    container_name: ccs_simulator
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - ccs_net

  mongo:
    image: mongo:6.0
    container_name: ccs_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - ccs_net

  postgres:
    image: postgres:15
    container_name: ccs_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: climate_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ccs_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  ccs_net:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
